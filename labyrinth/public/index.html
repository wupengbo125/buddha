<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F1ECE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="跟着线走">
<title>跟着线走</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--paper:#F1ECE2;--ink:#1F1D1A;--ink-soft:#5B5346;--accent:#B0472E}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 10px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 4px) env(safe-area-inset-left,0px);
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:background .3s,color .3s;
  }
  header{flex:0 0 auto;height:60px;position:relative;padding:0 18px}
  #hud{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  main{flex:1 1 auto;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}#art{z-index:1}#line{z-index:2}#fx{z-index:3}
  footer{flex:0 0 auto;min-height:64px;display:flex;align-items:center;justify-content:center;padding:0 22px 12px;text-align:center;font-size:13px;line-height:1.7;color:var(--ink-soft);transition:color .35s}
  footer.hit{color:var(--accent)}
  footer.calm{color:var(--ink)}
  .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:0 14px 12px;z-index:4;pointer-events:none}
  .tools button{pointer-events:auto;appearance:none;border:1px solid rgba(128,120,104,.28);background:rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12px;font-family:inherit;letter-spacing:.04em;cursor:pointer}
  .panel{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto;transition:opacity .2s}
  .panel.hidden{display:none}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .phead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.03em}
  .phead button{appearance:none;border:0;background:none;color:var(--accent);font-size:14px;font-family:inherit;padding:8px 4px;cursor:pointer}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mcard{appearance:none;text-align:left;font-family:inherit;border:1px solid rgba(128,120,104,.22);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 11px;cursor:pointer;color:var(--ink)}
  .mcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mcard b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
  .mcard span{font-size:11px;color:var(--ink-soft);line-height:1.5;display:block}
  .ptitle{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
  .prow{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;appearance:none;padding:0}
  .sw.on{border-color:var(--accent)}
  .sw i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
  <header><canvas id="hud"></canvas></header>
  <main>
    <canvas id="bg"></canvas>
    <canvas id="art"></canvas>
    <canvas id="line"></canvas>
    <canvas id="fx"></canvas>
    <div class="tools"><button id="btnAgain">重来</button><button id="btnPanel">模式</button><button id="btnSpeed">中速</button></div>
  </main>
  <footer id="hint">按住线头，跟着它走。走过的线会留在纸上。</footer>

  <div class="panel hidden" id="panel">
    <div class="phead"><h2>选一种走法</h2><button id="pclose">完成</button></div>
    <div class="pgrid" id="modeGrid"></div>
    <div class="ptitle">纸的颜色</div>
    <div class="prow" id="themeRow"></div>
  </div>
<script>
(() => {
  const bgC=document.getElementById('bg'), artC=document.getElementById('art'),
        lnC=document.getElementById('line'), fxC=document.getElementById('fx');
  const bgx=bgC.getContext('2d'), artx=artC.getContext('2d'),
        lnx=lnC.getContext('2d'), fxx=fxC.getContext('2d');
  const hintEl=document.getElementById('hint'),
        hudC=document.getElementById('hud'), hudx=hudC.getContext('2d'),
        btnSpeed=document.getElementById('btnSpeed'),
        btnAgain=document.getElementById('btnAgain'), btnPanel=document.getElementById('btnPanel'),
        panelEl=document.getElementById('panel'), pclose=document.getElementById('pclose'),
        modeGrid=document.getElementById('modeGrid'), themeRow=document.getElementById('themeRow');
  let hudDpr=1, hudW=0, hudH=0, hudTimer='00:00';

  const SPEEDS=[{v:70,label:'慢速'},{v:105,label:'中速'},{v:160,label:'快速'}];
  const QS=new URLSearchParams(location.search);
  const TURBO=parseFloat(QS.get('turbo')||'0');
  if(TURBO>0) SPEEDS.push({v:TURBO,label:'测速'});
  let speedIdx=1;

  const MARGIN=52;
  const FOLLOW_R=52;
  const TAIL_LEN=240;

  // ---------- 纸与色 ----------
  const THEMES=[
    {id:'paper',name:'宣纸',paper:'#F1ECE2',ink:'#1F1D1A',gb:'#1F1D1A',gray:'rgba(31,29,26,.52)',soft:'#5B5346',accent:'#B0472E',tex:'dots'},
    {id:'sky',name:'雾蓝',paper:'#E6EBF0',ink:'#182635',gb:'#182635',gray:'rgba(24,38,53,.5)',soft:'#4C5C6C',accent:'#B24A3C',tex:'grid'},
    {id:'moss',name:'苔绿',paper:'#E5EADE',ink:'#232B1F',gb:'#232B1F',gray:'rgba(35,43,31,.5)',soft:'#4E5A46',accent:'#A85C31',tex:'dots'},
    {id:'sand',name:'沙岩',paper:'#EFE3D0',ink:'#2C2318',gb:'#2C2318',gray:'rgba(44,35,24,.5)',soft:'#6A5A45',accent:'#B0472E',tex:'dots'},
    {id:'night',name:'夜墨',paper:'#14161A',ink:'#EDE8DC',gb:'#EDE8DC',dark:true,gray:'rgba(237,232,220,.42)',soft:'#8C877C',accent:'#C9603F',tex:'dots'},
    {id:'mid',name:'藏青',paper:'#1A2132',ink:'#E7EDF7',gb:'#E7EDF7',dark:true,gray:'rgba(231,237,247,.4)',soft:'#8592A8',accent:'#D2694A',tex:'grid'},
    {id:'char',name:'炭灰',paper:'#26241F',ink:'#F0E9DB',gb:'#F0E9DB',dark:true,gray:'rgba(240,233,219,.38)',soft:'#9A9184',accent:'#C9663F',tex:'none'}
  ];
  let themeIdx=0;

  const S={
    W:0,H:0,dpr:1,
    x:0,y:0,ang:0,prevX:0,prevY:0,t:0,
    holding:false,following:false,elapsed:0,best:0,
    lastHud:0,frames:0,seen:[],tail:[],finger:{x:-999,y:-999},
    curv:0,targetCurv:0,nextCurvAt:0,base:0,jit:0,phase:0,
    th:0,rr:0,nextR:0,nextRAt:0,thetaW:1,
    x2:0,y2:0
  };

  // ---------- 11 种走法 ----------
  function avoidBias(strength){
    let bias=0;
    const ax=S.x+Math.cos(S.ang)*118, ay=S.y+Math.sin(S.ang)*118;
    let near=1e9;
    const ref=S.tail;
    for(let i=0;i<ref.length;i+=3){
      const d=Math.hypot(ax-ref[i][0],ay-ref[i][1]);
      if(d<near) near=d;
    }
    if(near<120) bias+=(strength||0.9)*(1-near/120)*(Math.random()<0.5?-1:1);
    const look=Math.min(150,S.W*0.32);
    const px=S.x+Math.cos(S.ang)*look, py=S.y+Math.sin(S.ang)*look;
    if(px<MARGIN) bias-=1.0; else if(px>S.W-MARGIN) bias+=1.0;
    if(py<MARGIN) bias-=1.0; else if(py>S.H-MARGIN) bias+=1.0;
    return bias;
  }

  const MODES=[
    {name:'弧行',tint:'#F1ECE2',bg:'dots',tip:'大弧线慢慢游，最耐看',
     init(){S.curv=0;S.targetCurv=0;S.nextCurvAt=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){ S.targetCurv=(Math.random()*2-1)*0.42; S.nextCurvAt=0.7+Math.random()*1.1; }
       S.curv+=(S.targetCurv-S.curv)*Math.min(1,dt*4.5);
       S.ang+=(S.curv+avoidBias(0.9))*dt;
     }},
    {name:'疾转',tint:'#EEEEEA',bg:'hatch',tip:'每隔半秒换向，走不出直线',
     init(){S.nextCurvAt=0;S.base=-Math.PI/2;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){
         S.base=wrap(S.base+(Math.random()<0.5?-1:1)*(0.7+Math.random()*1.5));
         S.nextCurvAt=0.35+Math.random()*0.5;
       }
       S.ang=wrap(S.ang+wrap(S.base-S.ang)*Math.min(1,dt*3.2));
       S.ang+=avoidBias(0.35)*dt;
     }},
    {name:'手抖',tint:'#F5F1E4',bg:'ruled',tip:'主线在抖，像笔尖颤',
     init(){S.base=-Math.PI/2;S.jit=0;S.nextCurvAt=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){ S.base=wrap(S.base+(Math.random()*2-1)*1.15); S.nextCurvAt=0.35+Math.random()*0.55; }
       S.jit=S.jit*0.9+(Math.random()-0.5)*0.2;
       S.ang=wrap(S.ang+wrap(S.base-S.ang)*Math.min(1,dt*2.4)+S.jit);
       S.ang+=avoidBias(0.4)*dt;
     }},
    {name:'花瓣',tint:'#F8EFE6',bg:'rings',tip:'绕着中心开出不规则的花',
     init(){S.th=Math.random()*Math.PI*2;S.thetaW=(Math.random()<0.5?-1:1);S.k=3+Math.floor(Math.random()*7);S.ph=Math.random()*6.28;S.rr=40;S.x=S.W/2;S.y=S.H/2;},
     place(step,dt){
       const cx=S.W/2, cy=S.H/2, R=Math.min(S.W*0.45,S.H*0.41);
       S.th+=S.thetaW*dt*(0.55+0.15*Math.sin(S.t*0.4));
       const wob=1+0.35*Math.sin(S.t*0.55+S.ph);   // 花瓣大小也在慢慢变
       S.rr=R*(0.36+0.17*Math.sin(S.k*S.th+S.ph))*wob;
       S.x=cx+Math.cos(S.th)*S.rr*0.96;
       S.y=cy+Math.sin(S.th)*S.rr;
       S.ang=S.th+Math.PI/2;
     }},
    {name:'星芒',tint:'#14161A',bg:'stars',tip:'方向乱跳，画出放射的星',
     init(){S.nextCurvAt=0;S.base=-Math.PI/2;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){
         S.base=wrap(S.base+(Math.random()<0.5?-1:1)*(0.85+Math.random()*1.1));
         S.nextCurvAt=0.3+Math.random()*0.5;
       }
       S.ang=wrap(S.ang+wrap(S.base-S.ang)*Math.min(1,dt*4.5));
       S.ang+=avoidBias(0.4)*dt;
     }},
    {name:'双笔',tint:'#E6EBF0',bg:'cross',tip:'一条线配一条镜像线，像编织',
     init(){S.curv=0;S.targetCurv=0;S.nextCurvAt=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){ S.targetCurv=(Math.random()*2-1)*0.45; S.nextCurvAt=0.8+Math.random()*1.2; }
       S.curv+=(S.targetCurv-S.curv)*Math.min(1,dt*4);
       S.ang+=(S.curv+avoidBias(0.85))*dt;
     },
     mirror:true},
    {name:'呼吸',tint:'#E9EFE5',bg:'puffs',tip:'曲率像呼吸一样张合',
     init(){S.phase=Math.random()*6.28;S.nextCurvAt=0;S.drift=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){ S.phase+=1.1+Math.random()*2.2; S.nextCurvAt=1.6+Math.random()*2.2; S.driftTarget=(Math.random()*2-1)*0.7; }
       S.drift+=(S.driftTarget-S.drift)*Math.min(1,dt*2);
       S.ang+=(0.5*Math.sin(S.t*0.55+S.phase)+S.drift+avoidBias(0.75))*dt;
     }},
    {name:'潮汐',tint:'#E3EDF2',bg:'waves',tip:'高高低低的浪，一层层铺',
     init(){S.phase=Math.random()*6.28;S.phase2=Math.random()*6.28;},
     steer(dt){
       S.ang+=(0.34*Math.sin(S.t*0.8+S.phase)+0.22*Math.sin(S.t*2.17+S.phase2)+avoidBias(0.6))*dt;
     }},
    {name:'曼陀罗',tint:'#F1E8D4',bg:'radial',tip:'绕着中心一层层转出花盘',
     init(){S.th=0;S.phase=Math.random()*6.28;S.thetaW=(Math.random()<0.5?-1:1)*0.9;S.rr=60;S.nextR=60;S.nextRAt=0;S.x=S.W/2;S.y=S.H/2;},
     place(step,dt){
       const cx=S.W/2, cy=S.H/2, R=Math.min(S.W*0.46,S.H*0.43);
       if(S.t>S.nextRAt){
         S.nextR=Math.min(R,Math.max(R*0.42, S.nextR+(Math.random()*2-1)*R*0.34));
         if(Math.random()<0.4) S.thetaW*=-1;
         S.nextRAt=S.t+0.25+Math.random()*0.45;
       }
       S.rr+=(S.nextR-S.rr)*Math.min(1,dt*2.2);
       S.th+=S.thetaW*dt*(1.2+0.9*Math.sin(S.t*0.5+S.phase));
       S.x=cx+Math.cos(S.th)*S.rr;
       S.y=cy+Math.sin(S.th)*S.rr;
       S.ang=S.th+Math.PI/2;
     }},
    {name:'沙暴',tint:'#E9DCC3',bg:'sand',tip:'高频乱抖，密密麻麻',
     init(){S.base=-Math.PI/2;S.nextCurvAt=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){ S.base=wrap(S.base+(Math.random()*2-1)*1.4); S.nextCurvAt=0.18+Math.random()*0.3; }
       S.ang=wrap(S.ang+wrap(S.base-S.ang)*Math.min(1,dt*6)+(Math.random()-0.5)*0.5);
       S.ang+=avoidBias(0.3)*dt;
     }},
    {name:'蛇行',tint:'#E6EBDC',bg:'leaf',tip:'方向稳一会儿再拐，长蛇游走',
     init(){S.base=-Math.PI/2;S.nextCurvAt=0;},
     steer(dt){
       S.nextCurvAt-=dt;
       if(S.nextCurvAt<=0){
         S.base=wrap(S.base+(Math.random()<0.5?-1:1)*(0.4+Math.random()*0.9));
         S.nextCurvAt=0.9+Math.random()*1.3;
       }
       S.ang=wrap(S.ang+wrap(S.base-S.ang)*Math.min(1,dt*2.6));
     }}
  ];
  let modeIdx=0;

  function wrap(d){ while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return d; }

  function applyTheme(i){
    themeIdx=i;
    const T=themeOf();
    document.documentElement.style.setProperty('--paper',T.paper);
    document.documentElement.style.setProperty('--ink',T.ink);
    document.documentElement.style.setProperty('--ink-soft',T.soft);
    document.documentElement.style.setProperty('--accent',T.accent);
    document.querySelector('meta[name=theme-color]').setAttribute('content',T.paper);
    try{localStorage.setItem('line.theme',i<0?'auto':THEMES[i].id);}catch(e){}
  }
  const T0=()=>themeOf();

  // 顶部文字用 canvas 画：按物理像素渲染，PWA 全屏下也不会糊
  function drawHud(){
    if(!hudW) return;
    const T=T0();
    hudx.setTransform(hudDpr,0,0,hudDpr,0,0);
    hudx.clearRect(0,0,hudW,hudH);
    hudx.textBaseline='middle';
    const y=hudH/2+4;
    hudx.textAlign='left';
    hudx.fillStyle=T.ink;
    hudx.font='500 16px -apple-system,"PingFang SC",sans-serif';
    hudx.fillText('跟着线走',18,y);
    const w1=hudx.measureText('跟着线走').width;
    hudx.fillStyle=T.soft;
    hudx.font='400 12px -apple-system,"PingFang SC",sans-serif';
    hudx.fillText(MODES[modeIdx].name, 18+w1+9, y+1);

    hudx.textAlign='right';
    hudx.font='400 13px -apple-system,"PingFang SC",sans-serif';
    hudx.fillStyle=T.soft;
    hudx.fillText('最佳 '+fmt(S.best), hudW-18, y);
    const w2=hudx.measureText('最佳 '+fmt(S.best)).width;
    hudx.fillStyle=T.ink;
    hudx.fillText(hudTimer, hudW-18-w2-18, y);
  }

  function sizeHud(){
    const stage=hudC.parentElement;
    hudW=stage.clientWidth||window.innerWidth;
    hudH=stage.clientHeight||64;
    hudDpr=Math.min(window.devicePixelRatio||1,3);
    hudC.width=Math.floor(hudW*hudDpr);
    hudC.height=Math.floor(hudH*hudDpr);
    drawHud();
  }

  function setup(){
    const stage=bgC.parentElement;
    const W=stage.clientWidth||window.innerWidth;
    const H=stage.clientHeight||window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,3);
    S.W=W;S.H=H;S.dpr=dpr;
    for(const c of [bgC,artC,lnC,fxC]){
      c.width=Math.floor(W*dpr); c.height=Math.floor(H*dpr);
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    }
    paintBg();
    sizeHud();
    restart();
  }

  function lumOf(hex){
    const h=hex.replace('#',''); const n=parseInt(h,16);
    return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
  }
  function themeOf(){
    if(themeIdx>=0) return THEMES[themeIdx];
    const paper=MODES[modeIdx].tint||'#F1ECE2';
    if(lumOf(paper)<0.4) return {paper,ink:'#EDE8DC',gb:'#EDE8DC',gray:'rgba(237,232,220,.42)',soft:'#8C877C',accent:'#C9603F',dark:true};
    return {paper,ink:'#1F1D1A',gb:'#1F1D1A',gray:'rgba(31,29,26,.52)',soft:'#5B5346',accent:'#B0472E',dark:false};
  }
  const T0c=()=>themeOf();
  function rgba(hex,a){
    const h=hex.replace('#','');
    const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')';
  }
  function ga(a){ return rgba(T0c().gb,a); }
  function gi(a){ return rgba(T0c().ink,a); }
  function gp(){ return T0c().paper; }

  // 每种走法一套自己的背景纹样
  function paintBg(){
    const W=S.W,H=S.H,cx=W/2,cy=H/2;
    bgx.setTransform(S.dpr,0,0,S.dpr,0,0);
    bgx.clearRect(0,0,W,H);
    const kind=(MODES[modeIdx]&&MODES[modeIdx].bg)||'dots';

    if(kind==='dots'){                        // 宣纸：细密纤维点
      for(let i=0;i<W*H/700;i++){
        bgx.fillStyle=ga(0.014+Math.random()*0.030);
        bgx.fillRect(Math.random()*W,Math.random()*H,1,1);
      }
    }else if(kind==='grid'){                  // 稿纸：方格
      bgx.strokeStyle=ga(0.085); bgx.lineWidth=1;
      for(let x=0;x<W;x+=24){ bgx.beginPath();bgx.moveTo(x,0);bgx.lineTo(x,H);bgx.stroke(); }
      for(let y=0;y<H;y+=24){ bgx.beginPath();bgx.moveTo(0,y);bgx.lineTo(W,y);bgx.stroke(); }
      bgx.strokeStyle=ga(0.10); bgx.beginPath(); bgx.moveTo(0,H*0.08); bgx.lineTo(W,H*0.08); bgx.stroke();
    }else if(kind==='hatch'){                 // 斜纹纸
      bgx.strokeStyle=ga(0.045); bgx.lineWidth=1;
      for(let i=-H;i<W+H;i+=9){
        bgx.beginPath(); bgx.moveTo(i,0); bgx.lineTo(i+H,H); bgx.stroke();
      }
    }else if(kind==='cross'){                 // 十字网格
      bgx.strokeStyle=ga(0.075); bgx.lineWidth=1;
      for(let x=0;x<W;x+=38){ bgx.beginPath();bgx.moveTo(x,0);bgx.lineTo(x,H);bgx.stroke(); }
      for(let y=0;y<H;y+=38){ bgx.beginPath();bgx.moveTo(0,y);bgx.lineTo(W,y);bgx.stroke(); }
    }else if(kind==='stars'){                 // 夜：星点
      const n=Math.round(W*H/3200);
      for(let i=0;i<n;i++){
        const x=Math.random()*W, y=Math.random()*H, r=Math.random()*1.4+0.4;
        bgx.fillStyle=gi(T0c().dark?0.2+Math.random()*0.55:0.06+Math.random()*0.16);
        bgx.beginPath(); bgx.arc(x,y,r,0,6.283); bgx.fill();
      }
      const g=bgx.createRadialGradient(cx,cy*0.5,0,cx,cy*0.5,H*0.6);
      g.addColorStop(0,gi(T0c().dark?0.05:0.02)); g.addColorStop(1,gi(0));
      bgx.fillStyle=g; bgx.fillRect(0,0,W,H);
    }else if(kind==='rings'){                 // 水痕：淡淡同心圆
      bgx.strokeStyle=ga(0.052); bgx.lineWidth=1;
      for(let r=30;r<Math.max(W,H);r+=34){
        bgx.beginPath(); bgx.arc(cx,cy,r,0,6.283); bgx.stroke();
      }
    }else if(kind==='waves'){                 // 潮汐：横向波线
      bgx.strokeStyle=ga(0.05); bgx.lineWidth=1;
      for(let y=20;y<H;y+=30){
        bgx.beginPath();
        for(let x=0;x<=W;x+=6){
          const yy=y+Math.sin(x/46+y/40)*4;
          x===0?bgx.moveTo(x,yy):bgx.lineTo(x,yy);
        }
        bgx.stroke();
      }
    }else if(kind==='radial'){                // 曼陀罗：放射细线
      bgx.strokeStyle=ga(0.055); bgx.lineWidth=1;
      for(let a=0;a<360;a+=9){
        const rad=a*Math.PI/180;
        bgx.beginPath(); bgx.moveTo(cx,cy);
        bgx.lineTo(cx+Math.cos(rad)*Math.max(W,H), cy+Math.sin(rad)*Math.max(W,H));
        bgx.stroke();
      }
      bgx.strokeStyle=ga(0.06);
      bgx.beginPath(); bgx.arc(cx,cy,Math.min(W,H)*0.32,0,6.283); bgx.stroke();
    }else if(kind==='sand'){                  // 沙暴：粗颗粒
      for(let i=0;i<W*H/220;i++){
        bgx.fillStyle=ga(0.018+Math.random()*0.05);
        const r=Math.random()<0.15?2:1;
        bgx.fillRect(Math.random()*W,Math.random()*H,r,r);
      }
    }else if(kind==='leaf'){                  // 竹叶：斜向短笔触
      bgx.strokeStyle=ga(0.045); bgx.lineWidth=1.4;
      for(let i=0;i<260;i++){
        const x=Math.random()*W, y=Math.random()*H, l=12+Math.random()*22, a=(-0.9)+Math.random()*0.5;
        bgx.beginPath(); bgx.moveTo(x,y); bgx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); bgx.stroke();
      }
    }else if(kind==='puffs'){                 // 云纹：柔和的气团
      for(let i=0;i<26;i++){
        const x=Math.random()*W, y=Math.random()*H, r=40+Math.random()*90;
        const g=bgx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,ga(0.022)); g.addColorStop(1,ga(0));
        bgx.fillStyle=g; bgx.beginPath(); bgx.arc(x,y,r,0,6.283); bgx.fill();
      }
    }else if(kind==='ruled'){                 // 横格稿纸
      bgx.strokeStyle=ga(0.075); bgx.lineWidth=1;
      for(let y=16;y<H;y+=22){ bgx.beginPath();bgx.moveTo(0,y);bgx.lineTo(W,y);bgx.stroke(); }
      bgx.strokeStyle=ga(0.10); bgx.beginPath(); bgx.moveTo(34,0); bgx.lineTo(34,H); bgx.stroke();
    }
  }

  function clearArt(){
    artx.setTransform(1,0,0,1,0,0);
    artx.clearRect(0,0,artC.width,artC.height);
    artx.setTransform(S.dpr,0,0,S.dpr,0,0);
    lnx.setTransform(S.dpr,0,0,S.dpr,0,0);
    lnx.clearRect(0,0,S.W,S.H);
    fxx.setTransform(S.dpr,0,0,S.dpr,0,0);
    fxx.clearRect(0,0,S.W,S.H);
  }

  function restart(){
    clearArt();
    const M=MODES[modeIdx];
    S.x=S.W/2+(Math.random()-0.5)*S.W*0.18;
    S.y=S.H-MARGIN-80;   // 起点抬高一点，别被底部按钮压住
    S.ang=-Math.PI/2;
    S.prevX=S.x; S.prevY=S.y;
    S.t=0; S.elapsed=0; S.frames=0; S.seen=[]; S.following=false; S.tail=[];
    S.x2=S.x; S.y2=S.y;
    if(M.init) M.init();
    hudTimer='00:00'; drawHud();
    setHint('按住线头，跟着它走。走过的线会留在纸上。','');
  }

  function steer(dt){ MODES[modeIdx].steer ? MODES[modeIdx].steer(dt) : null; }

  function stepMove(step,dt){
    const M=MODES[modeIdx];
    S.prevX=S.x; S.prevY=S.y;
    if(M.place) M.place(step,dt);
    else{ S.x+=Math.cos(S.ang)*step; S.y+=Math.sin(S.ang)*step; }

    const minX = M.place ? 24 : MARGIN, minY = M.place ? 24 : MARGIN;
    const maxX = S.W-(M.place?24:MARGIN), maxY = S.H-(M.place?24:MARGIN);
    if(S.x<minX){ S.x=minX; if(!M.place) S.ang=wrap(Math.PI-S.ang+(Math.random()-0.5)*0.15); }
    else if(S.x>maxX){ S.x=maxX; if(!M.place) S.ang=wrap(Math.PI-S.ang+(Math.random()-0.5)*0.15); }
    if(S.y<minY){ S.y=minY; if(!M.place) S.ang=wrap(-S.ang+(Math.random()-0.5)*0.15); }
    else if(S.y>maxY){ S.y=maxY; if(!M.place) S.ang=wrap(-S.ang+(Math.random()-0.5)*0.15); }
  }

  function paintSeg(ctx,x0,y0,x1,y1,color,w){
    ctx.beginPath(); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=color; ctx.lineWidth=w;
    ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }

  function advance(dt){
    const step=SPEEDS[speedIdx].v*dt;
    const T=T0();
    stepMove(step,dt);

    // 走过的部分：浅墨永久留在纸上
    paintSeg(artx,S.prevX,S.prevY,S.x,S.y,T.gray,3.2);

    if(MODES[modeIdx].mirror){
      const cx=S.W/2, cy=S.H/2;
      const mx=cx*2-S.x, my=cy*2-S.y;
      paintSeg(artx,cx*2-S.prevX,cy*2-S.prevY,mx,my,T.gray,3.2);
      S.x2=mx; S.y2=my;
    }

    const t=S.tail;
    if(!t.length || Math.hypot(S.x-t[t.length-1][0], S.y-t[t.length-1][1])>3) t.push([S.x,S.y]);
    let len=0;
    for(let i=t.length-1;i>0;i--){
      len+=Math.hypot(t[i][0]-t[i-1][0], t[i][1]-t[i-1][1]);
      if(len>TAIL_LEN){ t.splice(0,i); break; }
    }
  }

  function drawTail(){
    const T=T0();
    lnx.setTransform(S.dpr,0,0,S.dpr,0,0);
    lnx.clearRect(0,0,S.W,S.H);
    const t=S.tail;
    if(t.length<2) return;
    lnx.beginPath(); lnx.lineCap='round'; lnx.lineJoin='round';
    lnx.strokeStyle=T.ink; lnx.lineWidth=3.2;
    lnx.moveTo(t[0][0],t[0][1]);
    for(let i=1;i<t.length;i++) lnx.lineTo(t[i][0],t[i][1]);
    lnx.stroke();
  }

  let last=0;
  function loop(ts){
    const dt=last?Math.min(0.05,(ts-last)/1000):0.016;
    last=ts;
    S.t+=dt;
    const now=performance.now();
    const dist=Math.hypot(S.finger.x-S.x,S.finger.y-S.y);
    const inRange=S.holding && dist<=FOLLOW_R;

    if(inRange){
      S.following=true;
      steer(dt);
      advance(dt);
      S.elapsed+=dt;
    }else{
      S.following=false;
      if(S.holding && now-(S.lastWaitHint||0)>2500){
        S.lastWaitHint=now;
        setHint('线在等你。手指回到圈里，它才继续。','hit');
      }
    }

    drawTail();
    drawFx(ts,inRange);
    hud(now);
    requestAnimationFrame(loop);
  }

  function drawFx(ts,inRange){
    const T=T0();
    fxx.setTransform(S.dpr,0,0,S.dpr,0,0);
    fxx.clearRect(0,0,S.W,S.H);
    const pulse=0.5+0.5*Math.sin(ts/380);
    const r=FOLLOW_R*0.92;
    const ac=T.dark?'#E8896A':T.accent;

    // 圈内一层很淡的底，让"可跟随范围"一眼能看见
    const grad=fxx.createRadialGradient(S.x,S.y,r*0.25,S.x,S.y,r);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,rgba(ac, T.dark?0.16:0.10));
    fxx.beginPath(); fxx.arc(S.x,S.y,r,0,6.283); fxx.fillStyle=grad; fxx.fill();

    // 圈线：加粗、加深
    fxx.beginPath(); fxx.arc(S.x,S.y,r,0,6.283);
    fxx.strokeStyle=rgba(ac, T.dark?0.85:0.62);
    fxx.lineWidth=1.8; fxx.stroke();

    // 里圈细线，深浅随跟随状态变化
    fxx.beginPath(); fxx.arc(S.x,S.y,r*0.84,0,6.283);
    fxx.strokeStyle=rgba(ac, inRange?(T.dark?0.75:0.55):(T.dark?0.45:0.32));
    fxx.lineWidth=1.2; fxx.stroke();

    fxx.beginPath(); fxx.arc(S.x,S.y,5.6,0,Math.PI*2);
    fxx.fillStyle=T.ink; fxx.fill();

    if(MODES[modeIdx].mirror){
      fxx.beginPath(); fxx.arc(S.x2,S.y2,4,0,Math.PI*2);
      fxx.strokeStyle=T.ink; fxx.globalAlpha=.5; fxx.lineWidth=1; fxx.stroke(); fxx.globalAlpha=1;
    }

    if(S.holding && S.finger.x>-100){
      fxx.beginPath(); fxx.arc(S.finger.x,S.finger.y,10,0,Math.PI*2);
      fxx.strokeStyle=inRange?rgba(T.dark?'#EDE8DC':'#1F1D1A',0.6):rgba(ac,0.75);
      fxx.lineWidth=1.4; fxx.stroke();
    }
  }

  const MOMENTS=[[60,'一分钟。手别急，让线带你走。'],[180,'三分钟。你已经很久没想别的了。']];

  function hud(now){
    if(now-S.lastHud<800) return;
    S.lastHud=now;
    hudTimer=fmt(S.elapsed);
    if(S.elapsed>S.best){
      S.best=S.elapsed;
      try{localStorage.setItem('line.best',String(S.best));}catch(e){}
    }
    drawHud();
    for(const [sec,msg] of MOMENTS){
      if(S.elapsed>=sec && S.seen.indexOf(sec)<0){ S.seen.push(sec); setHint(msg,'calm'); }
    }
  }

  let hintTimer=0;
  function setHint(msg,cls){
    hintEl.className=cls||'';
    hintEl.textContent=msg;
    clearTimeout(hintTimer);
    if(cls==='calm'){
      hintTimer=setTimeout(()=>{
        hintEl.className='';
        hintEl.textContent='按住线头，跟着它走。走过的线会留在纸上。';
      },3400);
    }
  }

  function fmt(sec){
    const m=Math.floor(sec/60), s=Math.floor(sec%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  // ---------- 面板 ----------
  function buildPanel(){
    modeGrid.innerHTML='';
    MODES.forEach((m,i)=>{
      const b=document.createElement('button');
      b.className='mcard'+(i===modeIdx?' on':'');
      b.innerHTML='<b>'+m.name+'</b><span>'+m.tip+'</span>';
      b.addEventListener('click',()=>{
        modeIdx=i;
        try{localStorage.setItem('line.mode',String(i));}catch(e){}
        [...modeGrid.children].forEach((c,k)=>c.classList.toggle('on',k===i));
        paintBg(); drawHud(); restart();
        closePanel();
      });
      modeGrid.appendChild(b);
    });
    themeRow.innerHTML='';
    const auto=document.createElement('button');
    auto.className='sw'+(themeIdx<0?' on':'');
    auto.style.background=MODES[modeIdx].tint||'#F1ECE2';
    auto.title='随模式';
    auto.innerHTML='<i style="background:'+T0().ink+'"></i>';
    auto.addEventListener('click',()=>{
      themeIdx=-1; applyTheme(-1); paintBg(); drawHud();
      [...themeRow.children].forEach((c,k)=>c.classList.toggle('on',k===0));
      restart();
    });
    themeRow.appendChild(auto);

    THEMES.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='sw'+(i===themeIdx?' on':'');
      b.style.background=t.paper;
      b.title=t.name;
      b.innerHTML='<i style="background:'+t.ink+'"></i>';
      b.addEventListener('click',()=>{
        applyTheme(i); paintBg(); drawHud();
        [...themeRow.children].forEach((c,k)=>c.classList.toggle('on',k===i+1));
        restart();
      });
      themeRow.appendChild(b);
    });
  }
  function openPanel(){ panelEl.classList.remove('hidden'); buildPanel(); }
  function closePanel(){ panelEl.classList.add('hidden'); }
  btnPanel.addEventListener('click',openPanel);
  pclose.addEventListener('click',closePanel);

  function setFinger(e){
    const r=fxC.getBoundingClientRect();
    S.finger.x=e.clientX-r.left; S.finger.y=e.clientY-r.top;
  }

  document.addEventListener('pointerdown',e=>{
    if(!panelEl.classList.contains('hidden')) return;
    if(e.target&&e.target.closest&&e.target.closest('button')) return;
    e.preventDefault(); setFinger(e); S.holding=true;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!S.holding) return;
    if(e.pointerType==='touch') e.preventDefault();
    setFinger(e);
  },{passive:false});
  const up=()=>{S.holding=false;S.finger.x=-999;S.finger.y=-999;};
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  window.addEventListener('blur',up);

  btnSpeed.addEventListener('click',()=>{
    speedIdx=(speedIdx+1)%SPEEDS.length;
    btnSpeed.textContent=SPEEDS[speedIdx].label;
  });
  btnAgain.addEventListener('click',()=>{ S.best=0; restart(); });

  window.addEventListener('resize',()=>setup());
  window.addEventListener('orientationchange',()=>setTimeout(setup,240));

  // 恢复上次的设置
  try{
    S.best=parseFloat(localStorage.getItem('line.best')||'0')||0;
    const th=localStorage.getItem('line.theme');
    if(th==='auto'||!th) themeIdx=-1;
    else{ const ti=THEMES.findIndex(t=>t.id===th); themeIdx=ti; }
    const mi=parseInt(localStorage.getItem('line.mode')||'0',10);
    if(mi>=0&&mi<MODES.length) modeIdx=mi;
  }catch(e){}
  if(QS.get('theme')){ const ti=THEMES.findIndex(t=>t.id===QS.get('theme')); if(ti>=0) themeIdx=ti; }
  if(QS.get('mode')){ modeIdx=Math.max(0,Math.min(MODES.length-1,parseInt(QS.get('mode'),10)||0)); }
  applyTheme(themeIdx);
  btnSpeed.textContent=SPEEDS[speedIdx].label;
  setup();
  window.__line=S;
  window.__modes=MODES;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
