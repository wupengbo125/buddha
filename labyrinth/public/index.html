<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F1ECE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>跟着线走</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="跟着线走">
<style>
  :root{--paper:#F1ECE2;--ink:#22201D;--ink-soft:#837A6D;--accent:#B0472E}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #F8F4EC 0%, var(--paper) 50%, #E8E1D4 100%);
    color:var(--ink);font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",ui-serif,Georgia,serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:none;user-select:none;-webkit-user-select:none}
  header{flex:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;letter-spacing:.18em;color:var(--ink-soft)}
  .brand{color:var(--ink);letter-spacing:.3em}
  .meta{display:flex;gap:18px;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  main{flex:1 1 auto;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}#line{z-index:1}#fx{z-index:2}
  footer{flex:0 0 auto;min-height:72px;display:flex;align-items:center;justify-content:center;padding:0 22px 14px;text-align:center;font-size:14px;line-height:1.6;color:var(--ink-soft);letter-spacing:.06em;transition:color .35s ease}
  footer.hit{color:var(--accent)}
  footer.calm{color:var(--ink)}
  .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;padding:0 14px 14px;z-index:3;pointer-events:none}
  .tools button{pointer-events:auto;appearance:none;border:1px solid rgba(34,32,29,.14);background:rgba(251,248,241,.55);color:var(--ink-soft);border-radius:999px;padding:7px 13px;font-size:12px;font-family:inherit;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(6px)}
</style>
</head>
<body>
  <header>
    <div class="brand">跟着线走</div>
    <div class="meta"><span id="timer">00:00</span><span id="best">最佳 00:00</span></div>
  </header>
  <main>
    <canvas id="bg"></canvas>
    <canvas id="line"></canvas>
    <canvas id="fx"></canvas>
    <div class="tools"><button id="btnSpeed">中速</button></div>
  </main>
  <footer id="hint">按住屏幕，指尖追着线头走。</footer>
<script>
(() => {
  const bgC = document.getElementById('bg');
  const lnC = document.getElementById('line');
  const fxC = document.getElementById('fx');
  const bgx = bgC.getContext('2d');
  const lnx = lnC.getContext('2d');
  const fxx = fxC.getContext('2d');
  const hintEl = document.getElementById('hint');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const btnSpeed = document.getElementById('btnSpeed');

  const INK = '#22201D';
  const SPEEDS = [{v:46,label:'慢速'},{v:78,label:'中速'},{v:124,label:'快速'}];
  let speedIdx = 1;

  const MARGIN = 60;
  const FOLLOW_R = 48;
  const LOST_MS = 1600;
  const START_GAP = 46;

  const S = {
    W:0,H:0,dpr:1, x:0,y:0,ang:0,prevX:0,prevY:0, t:0,
    run:false, holding:false, t0:0, elapsed:0, following:false,
    lostSince:0, best:0, lastHud:0, msgs:[], finger:{x:-999,y:-999},
    trail:[], grid:new Map(), tx:0, ty:0, len:0
  };

  function setup(){
    const stage = bgC.parentElement;
    const W = stage.clientWidth || window.innerWidth;
    const H = stage.clientHeight || window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    S.W=W;S.H=H;S.dpr=dpr;
    [bgC,lnC,fxC].forEach(c=>{
      c.width=Math.floor(W*dpr); c.height=Math.floor(H*dpr);
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    });
    paintBg();
    restart();
  }

  function paintBg(){
    const g=bgx;
    g.setTransform(S.dpr,0,0,S.dpr,0,0);
    g.clearRect(0,0,S.W,S.H);
    const n=Math.round(S.W*S.H/900);
    for(let i=0;i<n;i++){
      g.fillStyle='rgba(120,105,85,'+(0.02+Math.random()*0.035)+')';
      g.fillRect(Math.random()*S.W, Math.random()*S.H, 1, 1);
    }
  }

  function restart(){
    S.x=S.W/2+(Math.random()-0.5)*S.W*0.3;
    S.y=S.H-START_GAP;
    S.ang=-Math.PI/2+(Math.random()-0.5)*0.8;
    S.prevX=S.x;S.prevY=S.y;S.tx=S.x;S.ty=S.y;S.trail=[];S.grid=new Map();S.len=0;S.t=0;S.elapsed=0;S.following=false;S.lostSince=0;S.run=false;S.msgs=[];S.t0=0;
    lnx.setTransform(S.dpr,0,0,S.dpr,0,0);
    lnx.clearRect(0,0,S.W,S.H);
    timerEl.textContent='00:00';
  }

  const CELL = 56;

  function addTrail(x,y){
    const k = Math.floor(x/CELL)+':'+Math.floor(y/CELL);
    let a = S.grid.get(k);
    if(!a){ a=[]; S.grid.set(k,a); }
    S.trail.push({x,y});
    a.push(S.trail.length-1);
  }

  function nearestTrail(){
    if(S.trail.length < 90) return null;
    const i0=Math.floor(S.x/CELL), j0=Math.floor(S.y/CELL);
    let bx=0, by=0, bd=1e9;
    for(let i=i0-1;i<=i0+1;i++){
      for(let j=j0-1;j<=j0+1;j++){
        const arr=S.grid.get(i+':'+j);
        if(!arr) continue;
        for(const idx of arr){
          if(idx > S.trail.length-60) continue;
          const p=S.trail[idx];
          const d=Math.hypot(p.x-S.x,p.y-S.y);
          if(d<bd){ bd=d; bx=p.x; by=p.y; }
        }
      }
    }
    return bd < 56 ? {d:bd,x:bx,y:by} : null;
  }

  function wrap(d){
    while(d>Math.PI) d-=Math.PI*2;
    while(d<-Math.PI) d+=Math.PI*2;
    return d;
  }

  function steer(dt){
    // 1) 有界的左右摆动：只来回摆，不让角度单向累积成圈
    S.ang += (0.62*Math.sin(S.t*0.74)+0.32*Math.sin(S.t*0.29+2.0))*dt;

    // 2) 整体向前推进：一旦往下走得多，就慢慢掰回水平
    const sy=Math.sin(S.ang);
    if(sy > 0.10){
      const horiz = Math.cos(S.ang) >= 0 ? 0 : Math.PI;
      S.ang += wrap(horiz-S.ang)*Math.min(1,dt*1.5)*Math.min(1,sy*2);
    }

    // 3) 边界反射：撞上就折回，不再被吸着绕圈
    const c=Math.cos(S.ang), sn=Math.sin(S.ang);
    let rx=c, ry=sn;
    if(S.x<MARGIN && c<0) rx=-c;
    if(S.x>S.W-MARGIN && c>0) rx=-c;
    if(S.y<MARGIN && sn<0) ry=-sn;
    if(S.y>S.H-MARGIN && sn>0) ry=-sn;
    if(rx!==c || ry!==sn){
      S.ang += wrap(Math.atan2(ry,rx)-S.ang)*Math.min(1,dt*5);
    }

    // 4) 自避让：贴近自己画过的线就绕开，永远不叠成一团
    const near=nearestTrail();
    if(near){
      const away=Math.atan2(S.y-near.y, S.x-near.x);
      const w=Math.max(0,1-near.d/56);
      S.ang += wrap(away-S.ang)*Math.min(1,dt*2.4)*w;
    }
  }

  function advance(dt){
    const v=SPEEDS[speedIdx].v;
    const breathe=0.85+0.15*Math.sin(S.t*0.55);
    const step=v*breathe*dt;
    S.prevX=S.x;S.prevY=S.y;
    S.x+=Math.cos(S.ang)*step;
    S.y+=Math.sin(S.ang)*step;
    if(S.x<MARGIN){ S.x=MARGIN; S.ang=wrap(Math.PI-S.ang); }
    if(S.x>S.W-MARGIN){ S.x=S.W-MARGIN; S.ang=wrap(Math.PI-S.ang); }
    if(S.y<MARGIN){ S.y=MARGIN; S.ang=wrap(-S.ang); }
    if(S.y>S.H-MARGIN){ S.y=S.H-MARGIN; S.ang=wrap(-S.ang); }
    S.len += step;
    lnx.beginPath();
    lnx.lineCap='round';lnx.lineJoin='round';
    lnx.strokeStyle=INK;lnx.lineWidth=3.2;
    lnx.moveTo(S.prevX,S.prevY);
    lnx.lineTo(S.x,S.y);
    lnx.stroke();

    if(Math.hypot(S.x-S.tx, S.y-S.ty) > 4){
      addTrail(S.x, S.y);
      S.tx=S.x; S.ty=S.y;
    }
  }

  let last=0;
  function loop(ts){
    const dt=last?Math.min(0.05,(ts-last)/1000):0.016;
    last=ts;
    S.t+=dt;
    const now=performance.now();
    const dist=Math.hypot(S.finger.x-S.x, S.finger.y-S.y);
    const inRange=S.holding && dist<=FOLLOW_R;

    if(inRange){
      if(!S.following){S.following=true;}
      S.lostSince=0;
      if(!S.run){S.run=true; if(!S.t0) S.t0=now;}
      steer(dt); advance(dt);
      S.elapsed+=dt;
      if(S.len > 4600){ finishPage(); }
    }else{
      if(S.following){S.following=false;S.lostSince=now;}
      if(!S.holding && S.lostSince && now-S.lostSince>LOST_MS) endRun();
      if(S.holding && now-(S.lastWaitHint||0)>2500){S.lastWaitHint=now;hint('线在等你。手指回到圈里，它才继续。','hit');}
    }

    drawFx(ts, inRange);
    hud(now);
    requestAnimationFrame(loop);
  }

  function finishPage(){
    if(S.elapsed>0.5 && S.elapsed>S.best){
      S.best=S.elapsed;
      try{localStorage.setItem('line.best',String(S.best));}catch(e){}
      bestEl.textContent='最佳 '+fmt(S.best);
    }
    hint('这一张走满了。停一下，好，再来一张。','calm');
    restart();
  }

  function endRun(){
    if(S.elapsed>0.5 && S.elapsed>S.best){
      S.best=S.elapsed;
      try{localStorage.setItem('line.best',String(S.best));}catch(e){}
      bestEl.textContent='最佳 '+fmt(S.best);
    }
    restart();
    hint('线断了。再按住，跟着新的线头走。','hit');
  }

  function drawFx(ts,inRange){
    fxx.setTransform(S.dpr,0,0,S.dpr,0,0);
    fxx.clearRect(0,0,S.W,S.H);
    const pulse=0.5+0.5*Math.sin(ts/380);
    const r=FOLLOW_R*0.95;
    const grad=fxx.createRadialGradient(S.x,S.y,0,S.x,S.y,r);
    const a=inRange?0.10+pulse*0.06:0.07;
    grad.addColorStop(0,'rgba(176,71,46,'+a.toFixed(3)+')');
    grad.addColorStop(0.75,'rgba(176,71,46,0.05)');
    grad.addColorStop(1,'rgba(176,71,46,0)');
    fxx.fillStyle=grad;
    fxx.beginPath();fxx.arc(S.x,S.y,r,0,Math.PI*2);fxx.fill();

    fxx.beginPath();
    fxx.arc(S.x,S.y,r*0.86,0,Math.PI*2);
    fxx.strokeStyle='rgba(176,71,46,.38)';fxx.lineWidth=1;fxx.stroke();

    fxx.beginPath();
    fxx.arc(S.x,S.y,5.6,0,Math.PI*2);
    fxx.fillStyle=INK;fxx.fill();

    if(S.holding && S.finger.x>-100){
      fxx.beginPath();
      fxx.arc(S.finger.x,S.finger.y,9,0,Math.PI*2);
      fxx.strokeStyle=inRange?'rgba(34,32,29,.22)':'rgba(176,71,46,.55)';
      fxx.lineWidth=1.2;fxx.stroke();
    }
  }

  const MOMENTS=[[30,'半分钟了。手别急，让线带你走。'],[60,'一分钟。呼吸跟着线慢下来。'],[120,'两分钟。此刻只有这一根线。'],[300,'五分钟。你已经很久没在想别的了。']];

  function hud(now){
    if(now-S.lastHud<900) return;
    S.lastHud=now;
    timerEl.textContent=fmt(S.elapsed);
    if(!S.run) return;
    for(const [sec,msg] of MOMENTS){
      if(S.elapsed>=sec && !S.msgs.includes(sec)){S.msgs.push(sec);hint(msg,'calm');}
    }
  }

  let hintTimer=0;
  function hint(msg,cls){
    hintEl.className=cls||'';
    hintEl.textContent=msg;
    clearTimeout(hintTimer);
    if(cls!=='calm'){
      hintTimer=setTimeout(()=>{hintEl.className='';hintEl.textContent='按住屏幕，指尖追着线头走。';},2800);
    }
  }

  function fmt(sec){
    const m=Math.floor(sec/60), s=Math.floor(sec%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function setFinger(e){
    const r=fxC.getBoundingClientRect();
    S.finger.x=e.clientX-r.left;
    S.finger.y=e.clientY-r.top;
  }
  function setFingerFromEvent(e){
    const r=fxC.getBoundingClientRect();
    S.finger.x=e.clientX-r.left;
    S.finger.y=e.clientY-r.top;
  }

  document.addEventListener('pointerdown',e=>{
    if(e.target && e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    setFingerFromEvent(e);
    S.holding=true;
    if(S.elapsed===0) hint('跟着它，别让它跑出圈。');
  },{passive:false});

  document.addEventListener('pointermove',e=>{
    if(!S.holding) return;
    if(e.pointerType==='touch') e.preventDefault();
    setFingerFromEvent(e);
  },{passive:false});

  const up=()=>{S.holding=false;S.finger.x=-999;S.finger.y=-999;};
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  window.addEventListener('blur',up);

  btnSpeed.addEventListener('click',()=>{
    speedIdx=(speedIdx+1)%SPEEDS.length;
    btnSpeed.textContent=SPEEDS[speedIdx].label;
  });

  window.addEventListener('resize',()=>setup());
  window.addEventListener('orientationchange',()=>setTimeout(setup,240));

  try{S.best=parseFloat(localStorage.getItem('line.best')||'0')||0;}catch(e){}
  bestEl.textContent='最佳 '+fmt(S.best);
  btnSpeed.textContent=SPEEDS[speedIdx].label;
  setup();
  window.__line = S;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
