<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EFE9DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>指尖迷宫</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --paper:#EFE9DF;
    --paper-hi:#FBF8F1;
    --wall:#D6CEBD;
    --ink:#2A2723;
    --ink-soft:#7A7166;
    --accent:#B0472E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #F6F2E9 0%, var(--paper) 45%, #E7E0D3 100%);
    color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",ui-serif,Georgia,serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  header{
    flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:13px;letter-spacing:.18em;color:var(--ink-soft);
  }
  .brand{color:var(--ink);letter-spacing:.28em}
  .meta{display:flex;gap:16px;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  main{flex:1 1 auto;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  footer{
    flex:0 0 auto;min-height:76px;display:flex;align-items:center;justify-content:center;
    padding:0 20px 16px;text-align:center;
    font-size:14px;line-height:1.6;color:var(--ink-soft);letter-spacing:.06em;
    transition:color .4s ease;
  }
  footer.hit{color:var(--accent)}
  footer.done{color:var(--ink)}
  .settings{
    position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:3;
  }
  .settings button{
    appearance:none;border:1px solid rgba(42,39,35,.16);background:rgba(251,248,241,.6);
    color:var(--ink-soft);border-radius:999px;padding:7px 13px;font-size:12px;
    font-family:inherit;letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(6px);
  }
  .settings button.on{color:var(--accent);border-color:rgba(176,71,46,.4)}
  .breath{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 52%, rgba(176,71,46,.055) 0%, rgba(176,71,46,0) 62%);
    opacity:.35;transform:scale(.9);transition:none;
  }
</style>
</head>
<body>
  <div class="breath" id="breath"></div>
  <header>
    <div class="brand">指尖迷宫</div>
    <div class="meta">
      <span id="timer">00:00</span>
      <span id="count">0 次</span>
    </div>
  </header>
  <main>
    <canvas id="cv"></canvas>
    <div class="settings">
      <button id="btnLevel">五圈</button>
      <button id="btnSound">声音</button>
    </div>
  </main>
  <footer id="hint">把指尖放在入口，沿着线慢慢走进去。</footer>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hintEl = document.getElementById('hint');
  const timerEl = document.getElementById('timer');
  const countEl = document.getElementById('count');
  const breathEl = document.getElementById('breath');

  const C = {
    paper: '#EFE9DF',
    paperHi: '#FBF8F1',
    wall: '#D6CEBD',
    ink: '#2A2723',
    accent: '#B0472E'
  };

  const LEVELS = [
    { turns: 3, label: '三圈' },
    { turns: 5, label: '五圈' },
    { turns: 7, label: '七圈' }
  ];
  let levelIdx = 1;

  const stats = loadStats();
  countEl.textContent = stats.count + ' 次';

  const S = {
    pts: [],            // 采样点 {x,y,s}
    spacing: 5,
    channel: 4,
    center: { x: 0, y: 0 },
    outerR: 0,
    start: null,
    end: null,
    seedAngle: 0,
    sIndex: 0,
    phase: 'idle',      // idle | tracing | done
    t0: 0,
    elapsed: 0,
    doneAt: 0,
    lastHit: 0,
    sound: false,
    dpr: 1,
    W: 0,
    H: 0
  };

  let mazeCanvas = null;
  let lastFrameTs = 0;

  // ---------- 存储 ----------
  function loadStats() {
    try {
      const raw = JSON.parse(localStorage.getItem('labyrinth.stats') || '{}');
      return { count: raw.count || 0, best: raw.best || 0 };
    } catch (e) { return { count: 0, best: 0 }; }
  }
  function saveStats() {
    try { localStorage.setItem('labyrinth.stats', JSON.stringify(stats)); } catch (e) {}
  }

  // ---------- 几何 ----------
  function buildMaze() {
    const W = S.W, H = S.H;
    const cx = W / 2, cy = H / 2 - 6;
    const R = Math.min(W, H) / 2 - Math.min(28, Math.min(W, H) * 0.07);
    const turns = LEVELS[levelIdx].turns;
    const spacing = (R - R * 0.16) / turns;
    const N = Math.max(2400, turns * 460);

    S.center = { x: cx, y: cy };
    S.outerR = R;
    S.spacing = spacing;
    S.channel = spacing * 0.54;
    S.seedAngle = (Math.random() * Math.PI * 2);

    const pts = [];
    const rMin = R * 0.13;
    // 起笔在 -60°，向内顺时针收
    const a0 = S.seedAngle - Math.PI / 2;
    const total = turns * Math.PI * 2;

    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const th = a0 + total * t;
      const rBase = R - (R - rMin) * t;
      // 手绘感的轻微起伏：幅度随半径收缩，靠近中心时收敛成干净的一小圈
      const scale = Math.min(1, rBase / (R * 0.55));
      const wob = (Math.sin(th * 3.1) * 0.07 + Math.sin(th * 5.7 + 1.4) * 0.045) * spacing * scale;
      const r = rBase + wob;
      pts.push({ x: cx + Math.cos(th) * r, y: cy + Math.sin(th) * r, s: 0 });
    }
    // 累计弧长
    let acc = 0;
    for (let i = 0; i < pts.length; i++) {
      if (i > 0) acc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      pts[i].s = acc;
    }
    S.pts = pts;
    S.start = pts[0];
    S.end = pts[pts.length - 1];
    S.sIndex = 0;
  }

  function resize() {
    const stage = cv.parentElement;
    const W = stage.clientWidth || window.innerWidth;
    const H = stage.clientHeight || window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    S.dpr = dpr; S.W = W; S.H = H;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildMaze();
    renderMaze();
    reset(false);
  }

  // ---------- 绘制静态迷宫 ----------
  function strokeRange(g, from, to, width, color) {
    const pts = S.pts;
    g.beginPath();
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.strokeStyle = color;
    g.lineWidth = width;
    for (let i = from; i <= to; i++) {
      const p = pts[i];
      if (i === from) g.moveTo(p.x, p.y);
      else g.lineTo(p.x, p.y);
    }
    g.stroke();
  }

  function renderMaze() {
    const W = S.W, H = S.H, dpr = S.dpr;
    if (!mazeCanvas) mazeCanvas = document.createElement('canvas');
    mazeCanvas.width = Math.floor(W * dpr);
    mazeCanvas.height = Math.floor(H * dpr);
    const g = mazeCanvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    const c = S.channel;
    const wallW = Math.max(2, S.spacing * 0.16);

    // 三层描边：外层墙阴影 → 内层墙 → 亮纸通道，形成有厚度的凹槽
    strokeRange(g, 0, S.pts.length - 1, c + wallW * 2, 'rgba(120,110,95,.16)');
    strokeRange(g, 0, S.pts.length - 1, c + wallW * 1.35, C.wall);
    strokeRange(g, 0, S.pts.length - 1, c, C.paperHi);

    // 极淡的中心导引虚线（只在中段，提示方向感）
    g.save();
    g.globalAlpha = 0.35;
    g.setLineDash([2, 7]);
    g.lineWidth = 1;
    g.strokeStyle = C.wall;
    g.beginPath();
    for (let i = 0; i < S.pts.length; i++) {
      const p = S.pts[i];
      if (i === 0) g.moveTo(p.x, p.y); else g.lineTo(p.x, p.y);
    }
    g.stroke();
    g.restore();

    // 终点：中心一枚空心圆
    g.beginPath();
    g.arc(S.end.x, S.end.y, c * 0.62, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(42,39,35,.34)';
    g.lineWidth = 1.2;
    g.stroke();
    g.beginPath();
    g.arc(S.end.x, S.end.y, c * 0.2, 0, Math.PI * 2);
    g.fillStyle = 'rgba(42,39,35,.18)';
    g.fill();

    // 入口：一圈小环
    g.beginPath();
    g.arc(S.start.x, S.start.y, c * 0.5, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(176,71,46,.45)';
    g.lineWidth = 1.4;
    g.stroke();
  }

  // ---------- 主循环 ----------
  function loop(ts) {
    const dt = lastFrameTs ? Math.min(64, ts - lastFrameTs) : 16;
    lastFrameTs = ts;
    draw(ts, dt);
    requestAnimationFrame(loop);
  }

  function draw(ts, dt) {
    const W = S.W, H = S.H;
    ctx.clearRect(0, 0, W, H);
    if (mazeCanvas) ctx.drawImage(mazeCanvas, 0, 0, W, H);

    // 已描出的墨线
    if (S.sIndex > 0) {
      strokeRange(ctx, 0, S.sIndex, Math.max(1.6, S.channel * 0.52), C.ink);
    }

    // 手指所在处的柔光点
    if (S.phase === 'tracing') {
      const p = S.pts[Math.min(S.sIndex, S.pts.length - 1)];
      const pulse = 0.5 + 0.5 * Math.sin(ts / 420);
      const r = S.channel * (0.9 + pulse * 0.16);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
      grad.addColorStop(0, 'rgba(176,71,46,' + (0.16 + pulse * 0.1) + ')');
      grad.addColorStop(1, 'rgba(176,71,46,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(176,71,46,.55)';
      ctx.fill();
    }

    // 完成后中心扩散
    if (S.phase === 'done') {
      const age = (ts - S.doneAt) / 1000;
      for (let k = 0; k < 3; k++) {
        const a = age - k * 0.45;
        if (a > 0 && a < 3.4) {
          const rr = S.channel * 0.3 + a * S.channel * 2.4;
          ctx.beginPath();
          ctx.arc(S.end.x, S.end.y, rr, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(176,71,46,' + Math.max(0, (1 - a / 3.4)) * 0.28 + ')';
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }
      }
    }

    // 计时
    if (S.phase === 'tracing') {
      S.elapsed = (performance.now() - S.t0) / 1000;
      timerEl.textContent = fmt(S.elapsed);
    }

    // 呼吸光晕
    breathEl.style.opacity = String(0.28 + 0.22 * (0.5 + 0.5 * Math.sin(ts / 1000 * Math.PI / 5 * 2)));
  }

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  // ---------- 交互 ----------
  let dragging = false;
  const TOL_RATIO = 1.15;

  function nearest(px, py, lo, hi) {
    let best = -1, bestD = Infinity;
    for (let i = lo; i <= hi; i++) {
      const p = S.pts[i];
      const dx = p.x - px, dy = p.y - py;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return { i: best, d: Math.sqrt(bestD) };
  }

  function pos(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function onDown(e) {
    if (S.phase === 'done') { if (distanceToEnd() < 1) return; reset(true); }
    const p = pos(e);
    e.preventDefault();
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);

    if (S.phase === 'idle') {
      const d = Math.hypot(p.x - S.start.x, p.y - S.start.y);
      if (d > S.channel * 1.1) {
        flash('从这里开始。把指尖放在入口的小圈上。');
        return;
      }
      S.phase = 'tracing';
      S.t0 = performance.now();
      S.elapsed = 0;
      S.sIndex = 0;
      dragging = true;
      hint('沿着线走。不用快，慢一点更好。');
      return;
    }

    if (S.phase === 'tracing') {
      const cur = S.pts[S.sIndex];
      const d = Math.hypot(p.x - cur.x, p.y - cur.y);
      if (d > S.channel * 2.2) {
        flash('回到你的线头继续。');
        return;
      }
      dragging = true;
    }
  }

  function distanceToEnd() {
    return 99;
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const p = pos(e);
    const cur = S.sIndex;
    const span = Math.max(120, Math.round(S.pts.length * 0.03));
    const lo = Math.max(0, cur - span);
    const hi = Math.min(S.pts.length - 1, cur + span);
    const { i, d } = nearest(p.x, p.y, lo, hi);

    if (i >= 0 && d <= S.channel * TOL_RATIO) {
      S.sIndex = i;
      if (S.sIndex >= S.pts.length - 2) finish();
    } else {
      // 撞墙：轻微震动 + 文案
      const now = performance.now();
      if (now - S.lastHit > 700) {
        S.lastHit = now;
        if (navigator.vibrate) navigator.vibrate(18);
        flash('偏了一点。手往后一点，贴着线走。');
      }
    }
  }

  function onUp(e) {
    dragging = false;
  }

  function finish() {
    S.phase = 'done';
    S.doneAt = performance.now();
    S.sIndex = S.pts.length - 1;
    const sec = (performance.now() - S.t0) / 1000;
    stats.count += 1;
    if (!stats.best || sec < stats.best) stats.best = sec;
    saveStats();
    countEl.textContent = stats.count + ' 次';
    timerEl.textContent = fmt(sec);
    hintEl.className = 'done';
    hintEl.textContent = '抵达中心。停在这里，呼吸三次，再回去。';
    chime();
    if (navigator.vibrate) navigator.vibrate([10, 40, 16]);
  }

  function reset(rebuild) {
    S.phase = 'idle';
    S.sIndex = 0;
    S.elapsed = 0;
    timerEl.textContent = '00:00';
    hintEl.className = '';
    hintEl.textContent = '把指尖放在入口，沿着线慢慢走进去。';
    if (rebuild) {
      S.seedAngle = Math.random() * Math.PI * 2;
      // 用新种子重建同规格迷宫，避免每次都一样
      const oldAngle = 0;
      buildMaze();
      renderMaze();
    }
  }

  // ---------- 提示 ----------
  let hintTimer = 0;
  function flash(msg) {
    hintEl.className = 'hit';
    hintEl.textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      if (S.phase === 'done') return;
      hintEl.className = '';
      hintEl.textContent = S.phase === 'tracing' ? '沿着线走。不用快，慢一点更好。' : '把指尖放在入口，沿着线慢慢走进去。';
    }, 1600);
  }
  function hint(msg) {
    hintEl.className = '';
    hintEl.textContent = msg;
  }

  // ---------- 声音 ----------
  let actx = null;
  function chime() {
    if (!S.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      [0, 0.28].forEach((delay, k) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = k === 0 ? 528 : 396;
        g.gain.setValueAtTime(0, t + delay);
        g.gain.linearRampToValueAtTime(0.06, t + delay + 0.25);
        g.gain.exponentialRampToValueAtTime(0.0001, t + delay + 2.2);
        o.connect(g).connect(actx.destination);
        o.start(t + delay);
        o.stop(t + delay + 2.4);
      });
    } catch (e) {}
  }

  // ---------- 控件 ----------
  const btnLevel = document.getElementById('btnLevel');
  const btnSound = document.getElementById('btnSound');
  btnLevel.textContent = LEVELS[levelIdx].label;
  btnLevel.addEventListener('click', () => {
    levelIdx = (levelIdx + 1) % LEVELS.length;
    btnLevel.textContent = LEVELS[levelIdx].label;
    buildMaze();
    renderMaze();
    reset(false);
  });
  btnSound.addEventListener('click', () => {
    S.sound = !S.sound;
    btnSound.classList.toggle('on', S.sound);
  });

  // ---------- 启动 ----------
  cv.addEventListener('pointerdown', onDown, { passive: false });
  cv.addEventListener('pointermove', onMove, { passive: false });
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 220));

  resize();
  requestAnimationFrame(loop);
  window.__lab = S;
})();
</script>
</body>
</html>
