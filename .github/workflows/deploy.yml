name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply buddha --remote

      # 幂等：每次部署都保证 Worker secret common_password 存在（密码不进仓库 / 不进日志）。
      - name: Sync common_password secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMON_PASSWORD: ${{ secrets.COMMON_PASSWORD }}
        run: printf '%s' "$COMMON_PASSWORD" | pnpm exec wrangler secret put common_password

      # 账号名同样不进仓库：缺 COMMON_USERNAME 时这一步会失败，宁可不上线也不让登录失效。
      # 第二账号同样只走 secret：没配就跳过，配了就同步到 Worker。
      - name: Sync account2 secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT2_USERNAME: ${{ secrets.ACCOUNT2_USERNAME }}
          ACCOUNT2_PASSWORD: ${{ secrets.ACCOUNT2_PASSWORD }}
        run: |
          if [ -z "$ACCOUNT2_USERNAME" ]; then echo "未配置第二账号，跳过"; exit 0; fi
          printf '%s' "$ACCOUNT2_USERNAME" | pnpm exec wrangler secret put account2_username
          printf '%s' "$ACCOUNT2_PASSWORD" | pnpm exec wrangler secret put account2_password

      - name: Sync common_username secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMON_USERNAME: ${{ secrets.COMMON_USERNAME }}
        run: |
          test -n "$COMMON_USERNAME" || { echo "缺少 GitHub Secret COMMON_USERNAME"; exit 1; }
          printf '%s' "$COMMON_USERNAME" | pnpm exec wrangler secret put common_username

      - name: Build and Deploy with OpenNext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
